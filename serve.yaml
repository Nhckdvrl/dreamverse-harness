# FastH3 OmniRef (Ref2VA) on one RTX PRO 6000.
# Derived from FastVideo examples/serving/openai_fasth3_omniref_rtx_pro6000.yaml (FastVideo 5af9897e7):
# model_path points at the HF cache snapshot, the text encoder is offloaded, and the geometry is 480x832 (the Spark profile's).
generator:
  model_path: <local snapshot of FastVideo/FastH3-OmniRef-NVFP4-QAD at revision f01e6a23ac6066aa9eb622cf94b6259442e70ec2>
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit_vsa
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      vae: false
      pin_cpu_memory: true
      lazy_module_load: false
  pipeline:
    workload_type: i2v
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      h3_vsa_fp4:
        enabled: true
        prefix_precision: fp8
        two_level_p: true
        smooth_k: true
      video_decode_backend: h3-vae
      h3_sequential_load: false

server:
  host: 127.0.0.1
  port: 8000
  output_dir: ./server-outputs
  served_model_name: fasth3-omniref
  media_roots:
    - .

default_request:
  negative_prompt: ""
  sampling:
    height: 480
    width: 832
    num_frames: 124
    fps: 24
    num_inference_steps: 8
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
